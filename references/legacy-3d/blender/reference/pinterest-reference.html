nce":"데이터에 숨겨진 성과 스토리를 찾으세요.","Get updates, developer resources, and integration guides delivered straight to your inbox. --- mcpPage.reminder.subtext":"회원님의 받은 편지함으로 업데이트, 개발자 리소스, 통합 가이드가 바로 전달됩니다.","Is there a cost to use the Pinterest MCP server? --- mcpPage.faq.pricingQuestion":"Pinterest MCP 서버를 사용하는 데 비용이 드나요?","Less integration work --- mcpPage.features.lessWorkTitle":"통합 작업 감소","Loading skills --- ai_companion.skill_library.loading":"기술을 불러오는 중","Manage your business locations for local ads --- [m10n]proPartnerHeader.businessSubMenu.locationsHelperText":"지역 광고를 위해 비즈니스 위치를 관리하세요.","Meet the Pinterest MCP --- mcpPage.whatIsIt.eyebrow":"Pinterest MCP 만나기","Model Context Protocol (MCP) is an open standard that enables AI assistants to connect directly with external services. The Pinterest MCP Server brings Pinterest data into the AI tools you already use, giving agents native access to rich inspiration and creative signals — without custom code or fragile integrations. It helps teams move from idea to on-brand creative direction with Pinterest intelligence available right where they work. --- mcpPage.whatIsIt.description":"Model Context Protocol(MCP)은 AI 어시스턴트가 외부 서비스와 직접 연결할 수 있게 하는 개방형 표준입니다. Pinterest MCP 서버는 이미 사용하고 있는 AI 도구에 Pinterest 데이터를 제공해 에이전트가 맞춤형 코드나 불안정한 통합 없이도 풍부한 아이디어와 창의적인 신호에 직접 액세스할 수 있게 합니다. 업무 환경에서 바로 사용할 수 있는 Pinterest 인텔리전스를 통해 아이디어에서 브랜드에 최적화된 크리에이티브 기획까지 매끄럽게 연결합니다.","Model Context Protocol (MCP) is an open standard that enables AI assistants to connect with external services in a structured, predictable way. The Pinterest MCP server lets compatible AI tools interact with Pinterest's API through natural-language prompts. --- mcpPage.faq.whatIsMcpAnswer":"Model Context Protocol(MCP)은 AI 어시스턴트가 구조화되고 예측 가능한 방식으로 외부 서비스와 연결할 수 있도록 하는 오픈 표준입니다. Pinterest MCP 서버를 사용하면 호환 가능한 AI 도구가 자연어 프롬프트를 통해 Pinterest API와 상호작용할 수 있습니다.","No ad accounts have had a negative {{ metricName }} trend over the selected duration --- [m10n]bizAccess.mediaNetworkDashboard.partnerInsights.topBottomPerformersTable.noBottomAdAccountsFound":"선택한 기간 동안 부정적인 {{ metricName }} 추세를 보인 광고주 계정이 없습니다.","No ad accounts have had a positive {{ metricName }} trend over the selected duration --- [m10n]bizAccess.mediaNetworkDashboard.partnerInsights.topBottomPerformersTable.noTopAdAccountsFound":"선택한 기간 동안 긍정적인 {{ metricName }} 추세를 보인 광고주 계정이 없습니다.","OAuth 2.0 authorization and granular permissions keep credentials protected and access appropriately controlled. --- mcpPage.features.secureDescription":"OAuth 2.0 인증 및 세분화된 권한은 사용자 정보를 보호하고 액세스 권한을 적절히 제어합니다.","Off --- [m10n] createFlow.adGroupForm.audienceExtension.statusOff":"끄기","On --- [m10n] createFlow.adGroupForm.audienceExtension.statusOn":"켜기","Open-standard integration --- mcpPage.features.openStandardTitle":"오픈 표준 통합","Pinterest MCP Server brings the power of Pinterest data directly into the AI assistants, copilots, and agentic workflows you already use. Turn natural-language questions into fast, actionable insights, uncover performance opportunities in moments, and build what's next with more momentum than ever. More Pinterest. More possibilities. --- mcpPage.hero.subtext":"Pinterest MCP 서버는 Pinterest 데이터의 힘을 이미 사용하고 있는 AI 어시스턴트, 코파일럿, 에이전트 워크플로에 제공합니다. 자연어 질문을 빠르고 실행 가능한 인사이트로 바꾸고, 순간의 성과 기회를 발견하고, 그 어느 때보다 많은 추진력을 발휘할 다음 아이디어를 구축할 수 있습니다. 더 많은 Pinterest. 더 많은 가능성.","Pinterest does not charge a separate fee for the MCP server. --- mcpPage.faq.pricingAnswer":"Pinterest는 MCP 서버에 별도의 요금을 부과하지 않습니다.","Secure, scoped access --- mcpPage.features.secureTitle":"안전하고 범위가 지정된 액세스","Set up the Pinterest MCP Server once in your preferred AI environment. From there, you can search Pins, explore and manage Boards, uncover emerging trends, and access audience insights — all through natural-language prompts without leaving your chat or editor. --- mcpPage.howItWorks.description":"원하는 AI 환경에서 Pinterest MCP 서버를 한 번만 설정하세요. 거기에서 채팅이나 편집기를 떠나지 않고도 자연어 프롬프트를 통해 핀을 검색하고, 보드를 탐색 및 관리하고, 새로운 트렌드를 발견하고, 독자 인사이트에 액세스 할 수 있습니다.","Skip custom API wrappers. The MCP server manages authentication, rate limits, and response formatting, so teams can move faster. --- mcpPage.features.lessWorkDescription":"사용자 지정 API 래퍼를 건너뜁니다. MCP 서버가 인증, 속도 제한, 응답 형식 지정을 처리하므로 더 빠르게 진행할 수 있습니다.","The Pinterest MCP server provides secure, permissioned access to selected Pinterest Ads data, analytics, audience and keyword insights, and trends. It also supports AI-powered workflows for analyzing performance and, where authorized, creating and updating eligible Pinterest assets. --- mcpPage.faq.dataScopeAnswer":"Pinterest MCP 서버는 선택한 Pinterest 광고 데이터, 분석, 독자, 키워드 인사이트, 트렌드에 권한이 부여된 안전한 액세스를 제공합니다. 또한 AI 기반 워크플로를 통해 성과를 분석하고 승인 시 적합한 Pinterest 자산을 생성 및 업데이트할 수 있습니다.","The common language of AI and APIs --- mcpPage.whatIsIt.heading":"AI와 API의 공통 언어","The server is designed for MCP-compatible clients, including Claude, ChatGPT, Cursor, Visual Studio Code, GitHub Copilot, and Copilot Studio. Compatibility can vary by client and its MCP support. --- mcpPage.faq.compatibilityAnswer":"서버는 Claude, ChatGPT, Cursor, Visual Studio Code, GitHub Copilot, Copilot Studio 등 MCP 호환 클라이언트용으로 설계되었습니다. 호환성은 클라이언트 및 MCP 지원에 따라 달라질 수 있습니다.","Third-party mobile apps --- [m10n] createFlow.adGroupForm.audienceExtension.summaryLabel":"제3자 모바일 앱","Turn audience and keyword signals into your next smart move. --- mcpPage.howItWorks.highlightAudience":"독자와 키워드 신호를 바탕으로 어떻게 움직일지에 관한 현명한 판단을 내리세요.","Turn insights into action — create, update, and optimize with confidence. --- mcpPage.howItWorks.highlightAction":"자신감을 가지고 만들고, 업데이트하고, 최적화하는 등 인사이트를 행동으로 옮기세요.","Visit ad account page --- [m10n]bizAccess.mediaNetworkDashboard.partnerInsights.topBottomPerformersTable.visitAdAccountPage":"광고 계정 페이지 방문","We're aiming to launch soon! Sign up above for regular updates around our launch timeframe. --- mcpPage.faq.timelineAnswer":"곧 시작을 목표로 하고 있습니다! 위에서 가입하고 시작 일정과 관련한 정기 업데이트를 받으세요.","What Pinterest data will be accessible through the MCP? --- mcpPage.faq.dataScopeQuestion":"MCP를 통해 어떤 Pinterest 데이터에 액세스할 수 있나요?","What is Model Context Protocol (MCP)? --- mcpPage.faq.whatIsMcpQuestion":"Model Context Protocol(MCP)이란 무엇인가요?","When will the MCP server be publicly available? --- mcpPage.faq.timelineQuestion":"MCP 서버는 언제 공개적으로 제공되나요?","Which AI tools will the Pinterest MCP server support? --- mcpPage.faq.compatibilityQuestion":"Pinterest MCP 서버는 어떤 AI 도구를 지원하나요?","Yes. You'll need a Pinterest developer app that is approved and integrated with the API, along with a valid Pinterest OAuth token with the required permissions. --- mcpPage.faq.credentialsAnswer":"네. API와 통합되고 승인된 Pinterest 개발자 앱과 필수 권한이 있는 유효한 Pinterest OAuth 토큰이 있어야 합니다.","You might be wondering --- mcpPage.faq.heading":"궁금한 점","{{ completedCount }}/{{ totalCount }} file uploaded successfully. --- mediaLibrary.upload.progressPopup.complete _other":"{{ completedCount }}/{{ totalCount }} 파일이 업로드됐습니다.","{{ date }} · {{ time }} {{ timeZone }} · {{ durationMinutes }} min --- [m10n]ShopifyWebinar.banner.details _other":"{{ date }} · {{ time }} {{ timeZone }} · {{ durationMinutes }}분","{{ minutes }} min --- aiCompanion.quickAIActionButton.summarizeParentAccountPerformance.subtext _other":"{{ minutes }} 분"}},"inContextTranslation":false,"initialReduxState":{"adminUser":null,"articles":{},"billing":{"businessInformationForm":{},"billingInformationForm":{},"autoFillQPBillingChecked":true},"boards":{},"boardSectionPinsRefresh":{},"boardsections":{},"businessNux":{"currentStep":{"index":0,"canProceed":false},"businessGoals":[],"businessName":"","businessVertical":"","numberEmployees":"","hasWebsite":"","website":"","country":"","locale":"","advertisingIntent":null,"accountType":"","agencyRole":"","agencyClients":"","agencyContent":"","agencyService":"","agencyServiceOther":"","firstName":"","lastName":"","fullName":"","email":"","countryCode":"","phoneNumber":"","worksWithAgency":null,"leadId":"","whatsAppConsent":false,"calendlyUpsellEligible":false,"
